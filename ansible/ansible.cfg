[defaults]
inventory        = inventory.ini
remote_user      = sysadmin_cantabrico
host_key_checking = False
retry_files_enabled = False
roles_path       = roles
vault_password_file = ~/.ansible_vault_pass_cantabrico  

[ssh_connection]
# No hay SSH directo a las máquinas internas (no tienen IP pública, y sg-internal 
# solo acepta SSH desde MGMT). El trayecto es:
# Tu PC --SSH(22)--> bastión (FIP) --SSH(22)--> nodo interno (IP MGMT)
# El salto vive en group_vars/all.yml (ansible_ssh_common_args + bastion_fip).
# No se hardcodea aquí la IP porque ansible.cfg no admite expansión de variables.
pipelining = True
