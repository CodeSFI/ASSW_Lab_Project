[defaults]
inventory        = inventory.ini
remote_user      = sysadmin_cantabrico
host_key_checking = False
retry_files_enabled = False
roles_path       = roles
vault_password_file = ~/.ansible_vault_pass_cantabrico   # fuera del repo

[ssh_connection]
# No hay SSH directo a las máquinas internas (no tienen IP pública, y sg-internal 
# solo acepta SSH desde MGMT). El trayecto es:
# Tu PC --SSH(22)--> bastión (156.35.98.87) --SSH(22)--> app-node (10.10.99.21)
ssh_args = -o ProxyCommand="ssh -W %h:%p sysadmin_cantabrico@156.35.98.87" -o StrictHostKeyChecking=no
pipelining = True
