---
# Variables no sensibles. Los valores reales de contraseñas/secretos
# se referencian desde group_vars/vault.yml (cifrado con Ansible Vault).

ecommerce_db_name: ecommerce
ecommerce_db_user: db_ecommerce
ecommerce_db_password: "{{ vault_ecommerce_db_password }}"

gpg_backup_passphrase: "{{ vault_gpg_backup_passphrase }}"
backup_dir: /var/backups/postgresql
backup_retention_days: 7

postgresql_port: 5432
app_http_port: 8080

# IP flotante (FIP) del bastión. Cambia si se recrea la infra con Terraform;
# es la única puerta SSH pública y el ancla de todos los ProxyCommand.
bastion_fip: 156.35.98.153

# Salto SSH: PC --SSH(22)--> bastión(FIP) --SSH(22)--> nodo interno (IP MGMT).
# Al ser una connection var se templatiza: {{ bastion_fip }} se resuelve en runtime.
#ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p {{ ansible_user }}@{{ bastion_fip }}"'

ansible_ssh_private_key_file: ~/.ssh/Lab_project.pem

lb_fip: 156.35.98.152
