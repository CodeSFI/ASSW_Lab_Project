---
# Playbook maestro de suministro de la infraestructura.
# Aplica por capas: base -> datos -> aplicacion -> perimetro. Ejecutar desde el directorio ansible/:
#   ansible-playbook -i inventory.ini site.yml --ask-vault-pass

- name: Actualizacion base de todas las VMs
  hosts: all
  become: true
  roles:
    - role: common

- name: Suministro de la capa de datos (PostgreSQL)
  hosts: db
  become: true
  roles:
    - role: database

- name: Suministro de la capa de aplicacion (mock API)
  hosts: app
  become: true
  roles:
    - role: app_node

- name: Suministro del perimetro (Nginx + WAF ModSecurity)
  hosts: lb
  become: true
  roles:
    - role: perimeter_lb