# app_node: configuracion para que netavark no hable con firewalld.
#
# Estos nodos tienen firewalld instalado pero INACTIVO. Con el driver por
# defecto (firewalld), netavark se queda bloqueado en su helper
# 'firewalld-reload' (proceso colgado indefinidamente) y podman build/run
# esperan para siempre. Como el filtrado de red lo hacen los Security Groups
# de OpenStack, el host no necesita programar reglas de firewall propias.
[network]
firewall_driver = "none"